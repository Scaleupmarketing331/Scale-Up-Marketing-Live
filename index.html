<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Up Marketing - Client Proposal Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Scale Up Marketing</h2>
    <p>Client Proposal Request Form</p>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Company Name</label>
        <input type="text" placeholder="Company name">

        <label>Email Address</label>
        <input type="email" placeholder="example@gmail.com" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="+92 300 1234567">

        <label>Required Service</label>
        <select required>
            <option value="">Select Service</option>
            <option>Website Development</option>
            <option>Graphic Design</option>
            <option>Digital Marketing</option>
            <option>Social Media Management</option>
            <option>SEO</option>
            <option>AI Automation</option>
        </select>

        <label>Project Budget</label>
        <input type="text" placeholder="Your Budget">

        <label>Project Details</label>
        <textarea rows="5" placeholder="Describe your project"></textarea>

        <button type="submit">Send Proposal Request</button>
    </form>
</div>

</body>
</html>
